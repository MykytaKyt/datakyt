[project]
name = "datakyt"
version = "0.1.0"
description = "Equipment accounting for employees, equipment, furniture and software licenses."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "datakyt contributors" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "alembic>=1.13",
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pillow>=10.4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pydantic[email]>=2.8",
    "pyjwt>=2.9",
    "python-multipart>=0.0.18",
    "qrcode[pil]>=8.0",
    "sqlalchemy>=2.1",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
datakyt = "datakyt.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
    "types-openpyxl",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datakyt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once on purpose.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "typer.Argument",
    "typer.Option",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["datakyt"]

[[tool.mypy.overrides]]
module = ["qrcode", "qrcode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:datakyt.*"]

[tool.coverage.run]
source = ["datakyt"]
branch = true
omit = ["datakyt/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
