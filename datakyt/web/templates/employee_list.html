{% extends "base.html" %}
{% block title %}{{ t("nav.employees") }} · {{ t("app.title") }}{% endblock %}
{% block content %}
<h1>{{ t("nav.employees") }}</h1>
<form id="filters" class="toolbar" role="search" action="/ui/employees"
      hx-get="/ui/employees" hx-target="#rows" hx-trigger="input changed delay:300ms from:input, submit">
  <input type="search" name="q" value="{{ q or '' }}" placeholder="{{ t('common.search') }}"
         aria-label="{{ t('common.search') }}" autofocus>
  <noscript><button type="submit">{{ t("common.search") }}</button></noscript>
</form>
<div id="rows" class="card">{% include "_employee_rows.html" %}</div>
{% endblock %}
